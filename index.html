<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎡 RAYZN Şans Çarkı</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
            padding: 15px 10px 30px;
        }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 {
            font-size: 1.6em;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        .header .subtitle { font-size: 0.82em; color: #aaa; margin-top: 3px; }
        
        /* UID Giriş Formu */
        .uid-form {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 25px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            margin: 10px 0;
        }
        .uid-form h3 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .uid-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .uid-input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .uid-input::placeholder {
            color: #666;
        }
        .uid-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a0a00;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .uid-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(255, 165, 0, 0.5);
        }
        .uid-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .uid-info {
            font-size: 0.75em;
            color: #888;
            margin-top: 12px;
            line-height: 1.5;
        }
        
        /* Çark Bölümü (Başlangıçta gizli) */
        .wheel-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .wheel-section.show {
            display: flex;
        }
        .uid-display {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 8px 15px;
            margin: 8px 0;
            font-size: 0.75em;
            color: #FFD700;
        }
        .wheel-wrapper {
            position: relative;
            width: 310px;
            height: 310px;
            margin: 5px auto 10px;
        }
        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 2px 6px rgba(255,215,0,0.8));
        }
        #wheel-canvas {
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(255,215,0,0.3), 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(255,165,0,0.2);
            display: block;
        }
        .center-hub {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 52px; height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff9c4, #FFD700, #e65c00);
            border: 3px solid rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            z-index: 15;
            box-shadow: 0 0 20px rgba(255,215,0,0.9), inset 0 0 10px rgba(0,0,0,0.2);
        }
        .wheel-ring {
            position: absolute;
            top: 0; left: 0;
            width: 310px; height: 310px;
            border-radius: 50%;
            pointer-events: none;
            animation: ringPulse 2s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%,100%{ box-shadow: 0 0 0 3px rgba(255,215,0,0.2), 0 0 25px rgba(255,215,0,0.15); }
            50%    { box-shadow: 0 0 0 3px rgba(255,215,0,0.5), 0 0 40px rgba(255,215,0,0.35); }
        }
        .spinning-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 310px; height: 310px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: rgba(255,215,0,0.8);
            animation: spinRing 0.6s linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        .spinning-overlay.active { display: block; }
        @keyframes spinRing { to { transform: rotate(360deg); } }
        #spin-btn {
            position: relative;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF6B00 100%);
            color: #1a0a00;
            border: none;
            padding: 14px 44px;
            font-size: 1.15em;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(255,165,0,0.5), 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
            margin-bottom: 12px;
            overflow: hidden;
        }
        #spin-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 40%; height: 200%;
            background: rgba(255,255,255,0.25);
            transform: skewX(-20deg);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer { 0%,100%{ left:-60%; } 50%{ left:120%; } }
        #spin-btn:not(:disabled):hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(255,165,0,0.7); }
        #spin-btn:not(:disabled):active { transform: scale(0.98); }
        #spin-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        @keyframes btnGlow {
            0%,100%{ box-shadow: 0 4px 20px rgba(255,165,0,0.5), 0 2px 6px rgba(0,0,0,0.4); }
            50%    { box-shadow: 0 4px 35px rgba(255,165,0,0.85), 0 2px 6px rgba(0,0,0,0.4); }
        }
        #spin-btn.idle { animation: btnGlow 2s ease-in-out infinite; }
        #result-box {
            display: none;
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,165,0,0.05));
            border: 2px solid rgba(255,215,0,0.6);
            border-radius: 18px;
            padding: 18px 24px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 280px;
            max-width: 95%;
        }
        #result-box.show { display: block; }
        @keyframes popIn {
            from { opacity:0; transform:scale(0.6) translateY(20px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }
        .result-emoji { font-size: 2.4em; margin-bottom: 4px; }
        .result-prize {
            font-size: 1.8em;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255,215,0,0.6);
            margin-bottom: 4px;
        }
        .result-added { font-size: 0.88em; color: #ccc; }
        .result-added strong { color: #7fff7f; }
        .info-row { font-size: 0.72em; color: #666; margin-top: 8px; text-align: center; }
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0%  { transform: translateY(-15px) rotate(0deg);   opacity: 1; }
            100%{ transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        .error-box {
            display: none;
            background: rgba(231, 76, 60, 0.15);
            border: 2px solid rgba(231, 76, 60, 0.6);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 280px;
            max-width: 95%;
        }
        .error-box.show { display: block; }
        .error-emoji { font-size: 3em; margin-bottom: 10px; }
        .error-text { color: #e74c3c; font-size: 1.1em; margin-bottom: 15px; }
        .error-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }
        .loading-spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        .loading-spinner.show { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <h1>🎡 ŞANS ÇARKI</h1>
    <p class="subtitle">✨ Bugünkü şansını dene!</p>
</div>

<!-- UID Giriş Formu -->
<div class="uid-form" id="uid-form">
    <h3>🆔 Kullanıcı ID Girişi</h3>
    <input type="number" class="uid-input" id="uid-input" placeholder="Telegram ID'nizi girin">
    <button class="uid-btn" id="uid-btn" onclick="submitUid()">Devam Et</button>
    <div class="loading-spinner" id="loading-spinner"></div>
    <p class="uid-info">
        💡 Telegram ID'nizi öğrenmek için:<br>
        @userinfobot botuna gidin ve<br>
        "/start" yazın
    </p>
</div>

<!-- Çark Bölümü (Başlangıçta gizli) -->
<div class="wheel-section" id="wheel-section">
    <div class="uid-display">🆔 Kullanıcı ID: <span id="uid-span">-</span></div>
    
    <div class="wheel-wrapper">
        <svg class="pointer" width="30" height="36" viewBox="0 0 30 36">
            <polygon points="15,2 28,34 2,34" fill="#FFD700" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
        </svg>
        <div class="wheel-ring"></div>
        <canvas id="wheel-canvas" width="310" height="310"></canvas>
        <div class="spinning-overlay" id="spinning-ring"></div>
        <div class="center-hub">🎰</div>
    </div>

    <button id="spin-btn" class="idle" onclick="startSpin()">🎰 ÇARKI ÇEVİR</button>

    <div id="result-box">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <div class="result-prize" id="result-prize">5 TL</div>
        <div class="result-added">Ödülünüz: <strong id="result-amount">5 TL</strong> bakiyenize ekleniyor...</div>
    </div>

    <p class="info-row">🍀 Her gün 1 kez çevirebilirsiniz</p>
</div>

<div class="error-box" id="error-box">
    <div class="error-emoji">⚠️</div>
    <div class="error-text" id="error-text">Bir hata oluştu!</div>
    <button class="error-btn" onclick="closeApp()">Kapat</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.setHeaderColor('#0f0c29');
tg.setBackgroundColor('#0f0c29');

// URL'den parametreleri al
const params = new URLSearchParams(window.location.search);
const ALREADY_SPUN = params.get('already_spun') === '1';

let USER_UID = '';

// GERÇEK ÖDÜLLER (Bot ile aynı olmalı!)
const REAL_PRIZES = [
    { label: "💰 1 TL", amount: 1, weight: 85 },   // %85 ihtimal
    { label: "🎁 5 TL", amount: 5, weight: 15 }    // %15 ihtimal
];

// GÖRSEL ÖDÜLLER (Sadece çarkta gösterilir)
const SEGMENTS = [
    { label:"1 TL",      emoji:"💰", bg:"#C0392B", light:"#E74C3C" },
    { label:"5 TL",      emoji:"🎁", bg:"#1E8449", light:"#27AE60" },
    { label:"10 TL",     emoji:"💎", bg:"#1A5276", light:"#2980B9" },
    { label:"30 TL",     emoji:"🔥", bg:"#BA4A00", light:"#E67E22" },
    { label:"50 TL",     emoji:"⭐", bg:"#6C3483", light:"#8E44AD" },
    { label:"100 TL",    emoji:"🌟", bg:"#B7770D", light:"#F39C12" },
    { label:"200 TL",    emoji:"💵", bg:"#148F77", light:"#1ABC9C" },
    { label:"500 TL",    emoji:"💎", bg:"#7B241C", light:"#C0392B" },
    { label:"1.500 TL",  emoji:"👑", bg:"#5B2C6F", light:"#7D3C98" },
    { label:"2.000 TL",  emoji:"🏆", bg:"#9A7D0A", light:"#D4AC0D" },
];

const N = SEGMENTS.length;
const ARC = (2 * Math.PI) / N;
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');
const SIZE = 310, CX = SIZE / 2, CY = SIZE / 2, RADIUS = CX - 6;

let currentAngle = -Math.PI / 2;
let isSpinning = false;
let spinDone = false;

// UID Giriş Fonksiyonu
function submitUid() {
    const input = document.getElementById('uid-input');
    const uid = input.value.trim();
    
    if (!uid || uid === '') {
        tg.showAlert('Lütfen geçerli bir Kullanıcı ID girin!');
        return;
    }
    
    if (!/^\d+$/.test(uid)) {
        tg.showAlert('Kullanıcı ID sadece rakamlardan oluşmalıdır!');
        return;
    }
    
    USER_UID = uid;
    
    // Yükleme göster
    document.getElementById('uid-btn').style.display = 'none';
    document.getElementById('loading-spinner').classList.add('show');
    
    // Bot'a UID kontrolü gönder
    setTimeout(() => {
        // UID kontrol verisini gönder
        tg.sendData(JSON.stringify({
            action: "check_uid",
            uid: USER_UID
        }));
        
        // Çark bölümünü göster
        document.getElementById('uid-form').style.display = 'none';
        document.getElementById('wheel-section').classList.add('show');
        document.getElementById('uid-span').textContent = USER_UID;
        
        // Eğer zaten çevrilmişse butonu devre dışı bırak
        if (ALREADY_SPUN) {
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            btn.textContent = '⏰ Bugün Kullandın';
            btn.classList.remove('idle');
        }
        
        // Çarkı çiz
        drawWheel(currentAngle);
    }, 1000);
}

// Enter tuşu desteği
document.getElementById('uid-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        submitUid();
    }
});

function drawWheel(rot) {
    ctx.clearRect(0, 0, SIZE, SIZE);
    for (let i = 0; i < N; i++) {
        const seg = SEGMENTS[i];
        const startA = rot + i * ARC;
        const endA   = startA + ARC;
        const midA   = startA + ARC / 2;

        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, RADIUS, startA, endA);
        ctx.closePath();

        const grd = ctx.createLinearGradient(
            CX + Math.cos(midA)*20, CY + Math.sin(midA)*20,
            CX + Math.cos(midA)*RADIUS, CY + Math.sin(midA)*RADIUS
        );
        grd.addColorStop(0, seg.light);
        grd.addColorStop(1, seg.bg);
        ctx.fillStyle = grd;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(startA)*RADIUS, CY + Math.sin(startA)*RADIUS);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(midA);
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 4;
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(seg.label, RADIUS - 6, 4);
        ctx.font = '12px serif';
        ctx.fillText(seg.emoji, RADIUS - 6 - ctx.measureText(seg.label).width - 3, 4);
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    // Gold outer ring
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS, 0, 2*Math.PI);
    ctx.strokeStyle = 'rgba(255,215,0,0.75)';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Hub shadow
    ctx.beginPath();
    ctx.arc(CX, CY, 28, 0, 2*Math.PI);
    const hgrd = ctx.createRadialGradient(CX, CY, 0, CX, CY, 28);
    hgrd.addColorStop(0, 'rgba(30,20,0,0.7)');
    hgrd.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = hgrd;
    ctx.fill();
}

// Ağırlıklı rastgele ödül seç
function selectPrize() {
    const totalWeight = REAL_PRIZES.reduce((sum, p) => sum + p.weight, 0);
    let random = Math.random() * totalWeight;
    
    for (const prize of REAL_PRIZES) {
        random -= prize.weight;
        if (random <= 0) {
            return prize;
        }
    }
    return REAL_PRIZES[0];
}

// Ödülü görsel segment index'ine dönüştür
function getPrizeIndex(prizeLabel) {
    const cleanLabel = prizeLabel.replace(/[^0-9\sTL]/g, '').trim();
    for (let i = 0; i < SEGMENTS.length; i++) {
        if (SEGMENTS[i].label === cleanLabel) {
            return i;
        }
    }
    return 0;
}

function startSpin() {
    if (isSpinning || spinDone) return;
    
    if (!USER_UID) {
        showError('Kullanıcı ID bulunamadı!');
        return;
    }
    
    isSpinning = true;

    const btn = document.getElementById('spin-btn');
    btn.disabled = true;
    btn.classList.remove('idle');
    btn.textContent = '🌀 Dönüyor...';
    document.getElementById('spinning-ring').classList.add('active');

    try { tg.HapticFeedback.impactOccurred('medium'); } catch(e) {}

    const selectedPrize = selectPrize();
    const prizeIndex = getPrizeIndex(selectedPrize.label);
    
    const safeOffset = (Math.random() - 0.5) * ARC * 0.42;
    const targetAngle = (-Math.PI / 2) - prizeIndex * ARC - ARC / 2 + safeOffset;
    const totalRot = 9 * 2 * Math.PI + (targetAngle - currentAngle);

    const duration  = 5500;
    const startTime = performance.now();
    const startAngle = currentAngle;

    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    function frame(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        currentAngle = startAngle + easeOut(progress) * totalRot;
        drawWheel(currentAngle);
        if (progress < 1) {
            requestAnimationFrame(frame);
        } else {
            currentAngle = targetAngle;
            drawWheel(currentAngle);
            onSpinComplete(selectedPrize);
        }
    }
    requestAnimationFrame(frame);
}

function onSpinComplete(prize) {
    isSpinning = false;
    spinDone   = true;
    document.getElementById('spinning-ring').classList.remove('active');
    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}

    document.getElementById('result-emoji').textContent  = prize.label.split(' ')[0];
    document.getElementById('result-prize').textContent  = prize.label;
    document.getElementById('result-amount').textContent = prize.amount + ' TL';
    document.getElementById('result-box').classList.add('show');
    document.getElementById('spin-btn').textContent = '✅ Tamamlandı!';

    spawnConfetti();

    setTimeout(() => {
        const resultData = {
            action: "spin_result",
            uid: USER_UID,
            prize_label: prize.label,
            prize_amount: prize.am
