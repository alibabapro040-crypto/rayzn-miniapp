<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Rayzn Oyun Merkezi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #05060a;
      --card: #111320;
      --accent: #ffb800;
      --accent2: #7f5dff;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-subtle: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #222 0, #05060a 50%, #000 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px 12px 26px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: radial-gradient(circle at top, #181a28 0, var(--card) 55%);
      border-radius: 20px;
      padding: 18px 16px 20px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.8;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-subtle);
      margin-bottom: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      opacity: 0.85;
    }

    .tab.active {
      border-color: rgba(255, 255, 255, 0.6);
      background: linear-gradient(135deg, rgba(255, 184, 0, 0.16), rgba(127, 93, 255, 0.24));
      opacity: 1;
    }

    .screens {
      margin-top: 4px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .btn {
      width: 100%;
      border-radius: 14px;
      padding: 11px 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      transition: transform 0.08s ease, box-shadow 0.08s ease,
        filter 0.08s ease, opacity 0.08s ease;
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
      filter: brightness(0.96);
      box-shadow: 0 0 0 transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffb800, #ff4b8b);
      box-shadow: 0 10px 26px rgba(255, 75, 139, 0.45);
    }

    .btn-rocket {
      background: linear-gradient(135deg, #00e5ff, #7f5dff);
      box-shadow: 0 10px 26px rgba(0, 229, 255, 0.4);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-subtle);
      min-height: 28px;
    }

    .status strong {
      color: #fff;
    }

    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-subtle);
      text-align: center;
    }

    /* ÇARK ALANI */

    .wheel-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 6px auto 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.18);
      overflow: hidden;
      background: #111522;
      transition: transform 4.2s cubic-bezier(0.12, 0.01, 0, 1);
      box-shadow: 0 0 0 5px #111522, 0 12px 30px rgba(0, 0, 0, 0.9);
    }

    .wheel-center {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at top, #fff8e1 0, #ffb800 40%, #cc7a00 100%);
      border: 3px solid rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.9);
      z-index: 3;
    }

    .wheel-slice {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0 0;
      background: var(--color);
      transform: rotate(calc(var(--i) * 36deg)) skewY(-54deg);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .wheel-slice span {
      transform: skewY(54deg) rotate(18deg);
      text-align: right;
    }

    .wheel-pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 26px solid #ffd54f;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.8));
      z-index: 4;
    }

    /* ROKET ALANI */

    .rocket-space {
      position: relative;
      margin: 10px auto 4px;
      width: 100%;
      max-width: 320px;
      height: 210px;
      border-radius: 18px;
      background: radial-gradient(circle at 20% 0, #27334d 0, #050716 55%, #000 100%);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.9);
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.25) 0, transparent 40%),
        radial-gradient(circle at 70% 40%, rgba(255, 255, 255, 0.18) 0, transparent 45%),
        radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.22) 0, transparent 45%);
      opacity: 0.4;
      mix-blend-mode: screen;
    }

    .rocket {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      font-size: 40px;
      z-index: 2;
      transition: transform 1.6s cubic-bezier(0.11, 0.01, 0.11, 1);
    }

    .rocket.launching {
      transform: translate(-50%, -140px);
    }

    .rocket-fire {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: 10px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 20% 0, #fff 0, #ff9800 40%, #ff3d00 100%);
      filter: blur(1px);
      opacity: 0;
      transition: opacity 0.18s;
      z-index: 1;
      animation: flame 0.18s infinite alternate;
    }

    .rocket.launching + .rocket-fire {
      opacity: 1;
    }

    @keyframes flame {
      from {
        transform: translateX(-50%) scaleY(1);
      }
      to {
        transform: translateX(-50%) scaleY(1.4);
      }
    }

    .rocket-cloud {
      position: absolute;
      width: 100%;
      height: 60px;
      bottom: 0;
      background: radial-gradient(circle at 20% 0, rgba(255, 255, 255, 0.8) 0, transparent 60%),
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.8) 0, transparent 62%),
        radial-gradient(circle at 80% 0, rgba(255, 255, 255, 0.7) 0, transparent 60%);
      opacity: 0.56;
      filter: blur(1px);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header">
        <div class="title">
          🎮 Rayzn Oyun Merkezi
        </div>
        <div class="badge">Mini App</div>
      </div>
      <div class="subtitle">
        Her gün 1 oyun hakkın var. Çarkı çevir ya da roketi uçur; sonuç anında Telegram bot bakiyene işlenir.
      </div>

      <div class="tabs">
        <button class="tab active" data-target="screen-wheel">🎰 Çark</button>
        <button class="tab" data-target="screen-rocket">🚀 Roket Uçurma</button>
      </div>

      <div class="screens">
        <!-- ÇARK EKRANI -->
        <div class="screen active" id="screen-wheel">
          <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheel">
              <!-- 10 dilim -->
              <div class="wheel-slice" style="--i:0;--color:#ff7043;"><span>1 TL</span></div>
              <div class="wheel-slice" style="--i:1;--color:#ab47bc;"><span>5 TL</span></div>
              <div class="wheel-slice" style="--i:2;--color:#29b6f6;"><span>10 TL</span></div>
              <div class="wheel-slice" style="--i:3;--color:#66bb6a;"><span>30 TL</span></div>
              <div class="wheel-slice" style="--i:4;--color:#ffa726;"><span>50 TL</span></div>
              <div class="wheel-slice" style="--i:5;--color:#ec407a;"><span>100 TL</span></div>
              <div class="wheel-slice" style="--i:6;--color:#26c6da;"><span>200 TL</span></div>
              <div class="wheel-slice" style="--i:7;--color:#9ccc65;"><span>500 TL</span></div>
              <div class="wheel-slice" style="--i:8;--color:#ffca28;"><span>1.500 TL</span></div>
              <div class="wheel-slice" style="--i:9;--color:#8d6e63;"><span>2.000 TL</span></div>

              <div class="wheel-center">🎯</div>
            </div>
          </div>

          <button id="btnSpin" class="btn btn-primary">
            🔄 Çarkı Çevir
          </button>

          <div class="status" id="wheelStatus"></div>
        </div>

        <!-- ROKET EKRANI -->
        <div class="screen" id="screen-rocket">
          <div class="rocket-space">
            <div class="stars"></div>
            <div class="rocket" id="rocket">🚀</div>
            <div class="rocket-fire"></div>
            <div class="rocket-cloud"></div>
          </div>

          <button id="btnRocket" class="btn btn-rocket">
            🚀 Roketi Uçur
          </button>

          <div class="status" id="rocketStatus"></div>
        </div>
      </div>

      <div class="footer">
        Oyun sonucu, detaylı olarak Telegram bot ekranında gösterilir ve bakiyene otomatik işlenir.
      </div>
    </div>
  </div>

  <!-- Çark sesi -->
  <audio id="spinSound"
    src="https://upload.wikimedia.org/wikipedia/commons/5/5a/Slot_machine_bonus_spin_sound_effect.ogg"
  ></audio>

  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function safeSend(payload) {
      try {
        if (tg) {
          tg.sendData(JSON.stringify(payload));
        }
      } catch (e) {
        console.error("sendData error:", e);
      }
    }

    const tabs = document.querySelectorAll(".tab");
    const screens = document.querySelectorAll(".screen");

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");

        const targetId = tab.getAttribute("data-target");
        screens.forEach((s) => {
          s.classList.toggle("active", s.id === targetId);
        });
      });
    });

    // ==== ÇARK LOGİĞİ ====
    const wheelPrizes = [
      { label: "1 TL", amount: 1 },
      { label: "5 TL", amount: 5 },
      { label: "10 TL", amount: 10 },
      { label: "30 TL", amount: 30 },
      { label: "50 TL", amount: 50 },
      { label: "100 TL", amount: 100 },
      { label: "200 TL", amount: 200 },
      { label: "500 TL", amount: 500 },
      { label: "1.500 TL", amount: 1500 },
      { label: "2.000 TL", amount: 2000 }
    ];
    // 1 TL %99, 5 TL %1, diğerleri 0
    function chooseWheelIndex() {
      const r = Math.random();
      if (r < 0.99) return 0; // 1 TL
      return 1;               // 5 TL
    }

    const wheel = document.getElementById("wheel");
    const btnSpin = document.getElementById("btnSpin");
    const wheelStatus = document.getElementById("wheelStatus");
    const spinSound = document.getElementById("spinSound");

    let spinning = false;

    function spinWheel() {
      if (spinning) return;
      spinning = true;
      btnSpin.disabled = true;
      btnSpin.style.opacity = "0.7";
      wheelStatus.innerHTML = "🎰 Çark dönüyor...";

      try {
        spinSound.currentTime = 0;
        spinSound.play().catch(() => {});
      } catch (e) {}

      const index = chooseWheelIndex();
      const segmentAngle = 360 / wheelPrizes.length;
      const fullTurns = 5 + Math.floor(Math.random() * 3); // 5–7 tur
      const sliceCenter = index * segmentAngle + segmentAngle / 2;
      const finalRotation = fullTurns * 360 + (360 - sliceCenter);

      wheel.style.transform = `rotate(${finalRotation}deg)`;

      const onDone = () => {
        wheel.removeEventListener("transitionend", onDone);
        spinning = false;
        btnSpin.disabled = false;
        btnSpin.style.opacity = "1";

        const prize = wheelPrizes[index];
        wheelStatus.innerHTML =
          `🎯 <strong>Çark sonucu:</strong> <strong>${prize.label}</strong><br>` +
          `💰 Kazancın bot bakiyene işleniyor.`;

        safeSend({
          action: "spin",
          game: "wheel",
          win_amount: prize.amount,
          label: prize.label
        });
      };

      wheel.addEventListener("transitionend", onDone);
    }

    btnSpin.addEventListener("click", spinWheel);

    // ==== ROKET LOGİĞİ ====
    const rocket = document.getElementById("rocket");
    const btnRocket = document.getElementById("btnRocket");
    const rocketStatus = document.getElementById("rocketStatus");
    let rocketRunning = false;

    function launchRocket() {
      if (rocketRunning) return;
      rocketRunning = true;

      rocketStatus.innerHTML = "🚀 Roket havalanıyor, ödül hazırlanıyor...";
      btnRocket.disabled = true;
      btnRocket.style.opacity = "0.7";

      rocket.classList.add("launching");

      setTimeout(() => {
        rocket.classList.remove("launching");

        const r = Math.random();
        const reward = r < 0.99 ? 1 : 5; // %99 1 TL, %1 5 TL

        rocketStatus.innerHTML =
          `🎆 <strong>Roket ödülü:</strong> <strong>${reward} TL</strong><br>` +
          `💳 Bu tutar hemen bot bakiyene ekleniyor.`;

        safeSend({
          action: "spin",
          game: "rocket",
          win_amount: reward
        });

        rocketRunning = false;
        btnRocket.disabled = false;
        btnRocket.style.opacity = "1";
      }, 1700);
    }

    btnRocket.addEventListener("click", launchRocket);
  </script>
</body>
                </html>
