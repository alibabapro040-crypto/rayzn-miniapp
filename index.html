<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 RAYZN Oyun Merkezi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
            padding: 15px 10px 30px;
        }

        /* ANA MENÜ */
        .main-menu {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        .main-menu h1 {
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF6B00, #FFD700);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .main-menu .subtitle {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .game-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .game-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,165,0,0.05));
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .game-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .game-card:hover::before {
            opacity: 1;
        }
        
        .game-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #FFD700;
            box-shadow: 0 10px 40px rgba(255,215,0,0.3);
        }
        
        .game-icon {
            font-size: 3.5em;
            margin-bottom: 10px;
            display: block;
        }
        
        .game-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 5px;
        }
        
        .game-desc {
            font-size: 0.75em;
            color: #aaa;
        }

        /* UID FORM */
        .uid-form {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 25px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            margin: 10px 0;
        }
        
        .uid-form.show { display: block; }
        
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            color: #FFD700;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255,215,0,0.2);
        }

        /* WHEEL GAME */
        .wheel-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .wheel-section.show { display: flex; }
        
        .wheel-wrapper {
            position: relative;
            width: 310px;
            height: 310px;
            margin: 5px auto 10px;
        }
        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 2px 6px rgba(255,215,0,0.8));
        }
        #wheel-canvas {
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(255,215,0,0.3), 0 0 30px rgba(255,215,0,0.4);
        }
        .center-hub {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 52px; height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff9c4, #FFD700, #e65c00);
            border: 3px solid rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            z-index: 15;
            box-shadow: 0 0 20px rgba(255,215,0,0.9);
        }
        .wheel-ring {
            position: absolute;
            top: 0; left: 0;
            width: 310px; height: 310px;
            border-radius: 50%;
            pointer-events: none;
            animation: ringPulse 2s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%,100%{ box-shadow: 0 0 0 3px rgba(255,215,0,0.2), 0 0 25px rgba(255,215,0,0.15); }
            50%    { box-shadow: 0 0 0 3px rgba(255,215,0,0.5), 0 0 40px rgba(255,215,0,0.35); }
        }

        /* ROCKET GAME */
        .rocket-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 30%, #2a2a6e 60%, #4a4a8e 100%);
        }
        .rocket-section.show { display: flex; }
        
        .sky-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* Stars */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* Clouds */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 100px;
            opacity: 0.6;
        }
        
        /* Rocket */
        .rocket-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 150px;
            transition: all 0.1s ease-out;
        }
        
        .rocket {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }
        
        .rocket-body {
            width: 50px;
            height: 100px;
            background: linear-gradient(90deg, #e0e0e0 0%, #ffffff 50%, #c0c0c0 100%);
            border-radius: 50% 50% 10% 10%;
            position: absolute;
            left: 15px;
            top: 0;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.2), 0 0 20px rgba(255,255,255,0.3);
        }
        
        .rocket-window {
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #87CEEB, #1E90FF);
            border-radius: 50%;
            position: absolute;
            left: 27.5px;
            top: 25px;
            border: 3px solid #666;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        .rocket-fin-left, .rocket-fin-right {
            width: 0;
            height: 0;
            border-style: solid;
            position: absolute;
            bottom: 10px;
        }
        
        .rocket-fin-left {
            border-width: 0 0 40px 20px;
            border-color: transparent transparent #ff4444 transparent;
            left: -5px;
        }
        
        .rocket-fin-right {
            border-width: 0 20px 40px 0;
            border-color: transparent transparent #ff4444 transparent;
            right: -5px;
        }
        
        /* Enhanced Flame */
        .flame-container {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 80px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .flame-container.active {
            opacity: 1;
            animation: flameFlicker 0.1s infinite;
        }
        
        @keyframes flameFlicker {
            0%, 100% { transform: translateX(-50%) scaleY(1); }
            50% { transform: translateX(-50%) scaleY(1.1); }
        }
        
        .flame-core {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 50px;
            background: linear-gradient(to top, #ff0000, #ff6600, #ffff00, transparent);
            border-radius: 50% 50% 20% 20%;
            filter: blur(2px);
            animation: flameWave 0.2s infinite;
        }
        
        .flame-outer {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 70px;
            background: linear-gradient(to top, rgba(255,0,0,0.8), rgba(255,100,0,0.6), rgba(255,200,0,0.3), transparent);
            border-radius: 50%;
            filter: blur(8px);
            animation: flameWave 0.3s infinite reverse;
        }
        
        .flame-sparks {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
        }
        
        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffff00;
            border-radius: 50%;
            animation: sparkFly 0.5s infinite;
        }
        
        @keyframes flameWave {
            0%, 100% { transform: translateX(-50%) scaleX(1); }
            50% { transform: translateX(-50%) scaleX(1.2); }
        }
        
        @keyframes sparkFly {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
        
        /* Launch Button */
        .launch-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff4444, #ff6600);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 5px 30px rgba(255,100,0,0.5), inset 0 -5px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
            z-index: 100;
        }
        
        .launch-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 8px 40px rgba(255,100,0,0.7);
        }
        
        .launch-btn:disabled {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Airdrop */
        .airdrop-container {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 120px;
            opacity: 0;
            z-index: 50;
        }
        
        .airdrop-container.falling {
            animation: airdropFall 4s ease-in forwards;
        }
        
        @keyframes airdropFall {
            0% { top: -100px; opacity: 1; }
            20% { top: 20%; }
            100% { top: 60%; opacity: 1; }
        }
        
        .parachute {
            width: 100px;
            height: 60px;
            background: radial-gradient(ellipse at center, #ff6600 0%, #ff4400 100%);
            border-radius: 50% 50% 0 0;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .parachute::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 10px;
            right: 10px;
            height: 30px;
            border-left: 2px solid rgba(255,255,255,0.5);
            border-right: 2px solid rgba(255,255,255,0.5);
        }
        
        .parachute-lines {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
        }
        
        .parachute-lines::before,
        .parachute-lines::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background: rgba(255,255,255,0.6);
            top: 0;
        }
        
        .parachute-lines::before { left: 0; transform: rotate(-15deg); }
        .parachute-lines::after { right: 0; transform: rotate(15deg); }
        
        .airdrop-box {
            width: 60px;
            height: 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 10px;
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            box-shadow: 0 5px 20px rgba(255,215,0,0.5), inset 0 -3px 10px rgba(0,0,0,0.2);
            border: 2px solid #fff;
        }
        
        .prize-reveal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: all 0.5s;
            z-index: 200;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #FFD700;
        }
        
        .prize-reveal.show {
            opacity: 1;
        }
        
        /* Common Elements */
        #spin-btn, .spin-btn {
            position: relative;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF6B00 100%);
            color: #1a0a00;
            border: none;
            padding: 14px 44px;
            font-size: 1.15em;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(255,165,0,0.5);
            transition: all 0.15s;
            margin-bottom: 12px;
        }
        
        #spin-btn:hover, .spin-btn:hover { transform: scale(1.05); }
        #spin-btn:disabled, .spin-btn:disabled { opacity: 0.65; cursor: not-allowed; }
        
        .result-box, #result-box {
            display: none;
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,165,0,0.05));
            border: 2px solid rgba(255,215,0,0.6);
            border-radius: 18px;
            padding: 18px 24px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 280px;
            max-width: 95%;
        }
        .result-box.show, #result-box.show { display: block; }
        
        @keyframes popIn {
            from { opacity:0; transform:scale(0.6) translateY(20px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }
        
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            animation: confettiFall linear forwards;
            z-index: 9999;
        }
        @keyframes confettiFall {
            0%  { transform: translateY(-15px) rotate(0deg); opacity: 1; }
            100%{ transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        
        .uid-display {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 8px 15px;
            margin: 8px 0;
            font-size: 0.75em;
            color: #FFD700;
        }
        
        .spinning-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 310px; height: 310px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: rgba(255,215,0,0.8);
            animation: spinRing 0.6s linear infinite;
        }
        .spinning-overlay.active { display: block; }
        @keyframes spinRing { to { transform: rotate(360deg); } }

        .altitude-meter {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .altitude-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #ff0000, #ffff00);
            border-radius: 5px;
            transition: height 0.1s;
        }
        
        .altitude-text {
            position: absolute;
            right: 35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8em;
            color: #FFD700;
        }
    </style>
</head>
<body>

<!-- ANA MENÜ -->
<div class="main-menu" id="main-menu">
    <h1>🎰 RAYZN</h1>
    <p class="subtitle">Şansını seç ve kazan!</p>
    
    <div class="game-cards">
        <div class="game-card" onclick="selectGame('wheel')">
            <span class="game-icon">🎡</span>
            <div class="game-title">Şans Çarkı</div>
            <div class="game-desc">Döndür ve kazan</div>
        </div>
        
        <div class="game-card" onclick="selectGame('rocket')">
            <span class="game-icon">🚀</span>
            <div class="game-title">Roket Fırlat</div>
            <div class="game-desc">Gökyüzüne ulaş</div>
        </div>
    </div>
</div>

<!-- UID GİRİŞ -->
<div class="uid-form" id="uid-form">
    <button class="back-btn" onclick="goBack()">← Geri</button>
    <h3 style="color: #FFD700; margin-bottom: 15px;">🆔 Kullanıcı ID Girişi</h3>
    <input type="number" class="uid-input" id="uid-input" placeholder="Telegram ID'nizi girin">
    <button class="uid-btn" onclick="submitUid()">Devam Et</button>
    <p style="font-size: 0.75em; color: #888; margin-top: 12px;">
        💡 @userinfobot'a /start yazarak öğrenebilirsiniz
    </p>
</div>

<!-- ÇARK OYUNU -->
<div class="wheel-section" id="wheel-section">
    <button class="back-btn" onclick="goBack()" style="position: fixed; top: 15px; left: 15px;">← Menü</button>
    <div class="uid-display" style="margin-top: 50px;">🆔 ID: <span id="wheel-uid">-</span></div>
    
    <div class="wheel-wrapper">
        <svg class="pointer" w
